[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-screenshot-organizer"
version = "0.2.0"
description = "Organize screenshots with configurable vision AI providers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "chengnuo19"}]
keywords = ["screenshot", "vision", "ai", "organizer", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "anthropic>=0.40",
  "flet>=0.22.0",
  "openai>=1.0",
  "watchdog>=4.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "ruff>=0.8",
]

[project.scripts]
screenshot-organizer = "screenshot_organizer.cli:main"
screenshot-organizer-gui = "screenshot_organizer.gui:main"

[tool.setuptools]
include-package-data = true
packages = ["screenshot_organizer"]

[tool.setuptools.package-data]
screenshot_organizer = ["default_config.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
